<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Admin Login - Humanity Help Hub
    </title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>

        .login-container {

            max-width: 450px;

            margin: 60px auto;

        }

        .login-card {

            background: white;

            padding: 35px;

            border-radius: 18px;

            box-shadow:
            0 5px 20px
            rgba(0,0,0,0.10);
        }

        .login-title {

            text-align: center;

            color: #1f4e79;

            margin-bottom: 10px;
        }

        .login-subtitle {

            text-align: center;

            color: #777;

            margin-bottom: 25px;
        }

        .login-card label {

            display: block;

            margin-top: 15px;

            margin-bottom: 7px;

            font-weight: bold;
        }

        .login-card input {

            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 8px;

            box-sizing: border-box;
        }

        .login-btn {

            width: 100%;

            margin-top: 25px;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background: #1f6feb;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        .login-btn:hover {

            opacity: 0.9;
        }

        .error {

            background: #f8d7da;

            color: #842029;

            padding: 12px;

            border-radius: 8px;

            text-align: center;

            margin-bottom: 15px;
        }

        .back-home {

            display: block;

            text-align: center;

            margin-top: 20px;

            text-decoration: none;
        }

    </style>

</head>


<body>

<div class="container">

    <div class="login-container">

        <div class="login-card">

            <h1 class="login-title">
                🔐 Admin Login
            </h1>

            <p class="login-subtitle">
                Humanity Help Hub
            </p>


            {% if error %}

            <div class="error">
                ❌ {{ error }}
            </div>

            {% endif %}


            <form method="POST"
                  action="{{ url_for('admin_login') }}">

                <label for="username">
                    👤 Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter username"
                    required
                >


                <label for="password">
                    🔑 Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter password"
                    required
                >


                <button
                    type="submit"
                    class="login-btn">

                    🔓 Login

                </button>

            </form>


            <a href="/"
               class="back-home">
<a href="{{ url_for('admin_logout') }}"
   class="home-button"
   style="background:#dc3545;color:white;padding:12px;border-radius:8px;text-decoration:none;">
    🔒 Logout
</a>
                ← Back to Home

            </a>

        </div>

    </div>

</div>

</body>

</html>
